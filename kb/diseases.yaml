    url: "https://www.fao.org/agriculture/crops/thematic-sitemap/theme/pests/wrdgp/en/"
  - id: agroatlas
    title: "Агроэкологический атлас России и сопредельных стран (ВИЗР): болезни растений"
    url: "https://www.agroatlas.ru/ru/content/diseases/"
  - id: cimmyt
    title: "CIMMYT — Wheat diseases (rusts, septoria, FHB)"
    url: "https://www.cimmyt.org/"
  - id: qian2025
    title: "Qian J. et al. GDFC-YOLO… Agriculture 2025, 15(14):1526 (датасет)"
    url: "https://www.mdpi.com/2077-0472/15/14/1526"

diseases:
  leaf_rust:
    severity: high
    name: {kk: "Қоңыр тат", ru: "Бурая (листовая) ржавчина"}
    pathogen: "Puccinia triticina"
    organ: {kk: "жапырақ", ru: "лист"}
    symptoms:
      kk: "Жапырақтың үстіңгі бетінде ретсіз шашыраған ұсақ (1–1,5 мм) дөңгелек қызғылт-қоңыр жастықшалар (уредопустулалар). Саусақпен сүртсе, тот түстес ұнтақ (споралар) қалады. Қатты зақымданғанда жапырақ сарғайып, мерзімінен бұрын кебеді."
      ru: "Мелкие (1–1,5 мм) округлые рыже-бурые подушечки (уредопустулы), беспорядочно рассеянные по верхней стороне листа. При растирании на пальцах остаётся ржавый порошок спор. При сильном поражении лист желтеет и преждевременно засыхает."
    conditions:
      kk: "Жылы (15–25 °C) және ылғалды ауа райы, түнгі шық, жаңбырдан кейінгі жылы күндер. Солтүстік Қазақстанда шілде айында жиі тарайды."
      ru: "Тёплая (15–25 °C) влажная погода, ночные росы, тёплые дни после дождей. В Северном Казахстане массово развивается чаще в июле."
    threshold:
      kk: "Шамамен: түтікке шығу — масақтану кезеңінде жоғарғы жапырақтардың 1–5 %-ы зақымданса — өңдеу керек."
      ru: "Ориентировочно: 1–5 % поражения верхних листьев в фазе выход в трубку — колошение — сигнал к обработке."
    actions:
      agro:
        kk: "Егісті аптасына 1–2 рет тексеріңіз, әсіресе ту жапырақты. Зақымданған учаскелерді картаға белгілеп, көршілерге хабарлаңыз."
        ru: "Осматривайте посев 1–2 раза в неделю, особенно флаговый лист. Отмечайте очаги на карте и предупредите соседние хозяйства."
      chemical:
        kk: "Триазолдар (мысалы, тебуконазол, пропиконазол) немесе триазол + стробилурин (азоксистробин, пираклостробин) негізіндегі фунгицидтер — тек ҚР-да тіркелген препараттар, нұсқаулықтағы мөлшермен."
        ru: "Фунгициды на основе триазолов (например, тебуконазол, пропиконазол) или смесей триазол + стробилурин (азоксистробин, пираклостробин) — только зарегистрированные в РК препараты, в дозе по инструкции."
    timing:
      kk: "Алғашқы пустулалар ту жапырақта немесе одан төменгі жапырақта пайда болғанда. Ту жапырақты қорғау — өнімді сақтаудың басты шарты."
      ru: "При появлении первых пустул на флаговом или подфлаговом листе. Защита флагового листа — главное для сохранения урожая."
    prevention:
      kk: "Төзімді сорттар, ауыспалы егіс, өздігінен өскен (падалица) бидайды жою, азотты шамадан тыс бермеу, оңтайлы себу мерзімі."
      ru: "Устойчивые сорта, севооборот, уничтожение падалицы, без избытка азота, оптимальные сроки сева."
    similar:
      kk: "Сары таттан айырмашылығы: пустулалар жолақ түзбейді, ретсіз шашыраған."
      ru: "Отличие от жёлтой ржавчины: пустулы не выстраиваются в полосы, разбросаны беспорядочно."

  stripe_rust:
    severity: high
    name: {kk: "Сары (жолақты) тат", ru: "Жёлтая (полосатая) ржавчина"}
    pathogen: "Puccinia striiformis f. sp. tritici"
    organ: {kk: "жапырақ, масақ", ru: "лист, колос"}
    symptoms:
      kk: "Жапырақ жүйкелерінің бойымен тізбектеле орналасқан ұсақ лимон-сары пустулалар — ұзын сары жолақтар. Кейін ұлпа қоңырланып, кебеді. Масақ қабыршақтарында да болуы мүмкін."
      ru: "Мелкие лимонно-жёлтые пустулы, выстроенные цепочками вдоль жилок — длинные жёлтые полосы. Позже ткань буреет и засыхает. Может поражать и колосковые чешуи."
    conditions:
      kk: "Салқын (10–15 °C) ылғалды ауа райы, шық. Оңтүстік және оңтүстік-шығыс Қазақстанда жиі, суық көктемде солтүстікте де кездеседі."
      ru: "Прохладная (10–15 °C) влажная погода, росы. Чаще на юге и юго-востоке Казахстана, в прохладные вёсны — и на севере."
    threshold:
      kk: "Шамамен: алғашқы ошақтар (жапырақтардың 1 %-ға дейін зақымдануы) — бірден өңдеу; ауру өте тез тарайды."
      ru: "Ориентировочно: уже первые очаги (до 1 % поражения листьев) — повод к немедленной обработке, болезнь распространяется очень быстро."
    actions:
      agro:
        kk: "Ошақтарды ерте табу маңызды: егістің жел жақ шетін және ойпаңдарды тексеріңіз."
        ru: "Важно раннее обнаружение очагов: проверяйте наветренные края поля и понижения."
      chemical:
        kk: "Триазол немесе триазол + стробилурин фунгицидтері (ҚР тізіміндегі). Қатты зақымданса, 2–3 аптадан кейін қайта өңдеу қажет болуы мүмкін."
        ru: "Фунгициды из групп триазолов или триазол + стробилурин (из списка РК). При сильном развитии может понадобиться повторная обработка через 2–3 недели."
    timing:
      kk: "Ошақ байқалған бойда, түп ату — масақтану кезеңдерінде."
      ru: "Сразу при обнаружении очагов, в фазах кущение — колошение."
    prevention:
      kk: "Төзімді сорттар, падалицаны жою, күздік және жаздық бидайды қатар екпеу."
      ru: "Устойчивые сорта, уничтожение падалицы, не размещать озимую и яровую пшеницу рядом."
    similar:
      kk: "Қоңыр таттан айырмашылығы: пустулалар сары және жолақ болып орналасқан."
      ru: "Отличие от бурой ржавчины: пустулы жёлтые и расположены полосами."

  powdery_mildew:
    severity: medium
    name: {kk: "Ақ ұнтақ ауруы", ru: "Мучнистая роса"}
    pathogen: "Blumeria graminis f. sp. tritici"
    organ: {kk: "жапырақ, сабақ", ru: "лист, стебель"}
    symptoms:
      kk: "Жапырақ пен сабақта ақ, кейін сұрғылт мақта тәрізді ұнтақ дақтар; саусақпен оңай сүртіледі. Кейін ішінде қара нүктелер (клейстотецийлер) пайда болады."
      ru: "Белый, затем сероватый паутинисто-мучнистый налёт пятнами на листьях и стеблях, легко стирается пальцем. Позже в налёте появляются тёмные точки (клейстотеции)."
    conditions:
      kk: "Қалың егіс, артық азот, 15–22 °C, ауа ылғалдылығы жоғары, бірақ жаңбыр аз."
      ru: "Загущённые посевы, избыток азота, 15–22 °C, высокая влажность воздуха без обильных дождей."
    threshold:
      kk: "Шамамен: түп ату — түтікке шығу кезеңінде жапырақ бетінің 3–5 %-ы ақ ұнтақпен жабылса."
      ru: "Ориентировочно: 3–5 % поверхности листьев с налётом в фазе кущение — выход в трубку."
    actions:
      agro:
        kk: "Себу нормасын сақтау, азотты бөліп беру, егісті желдету үшін қалыңдатпау."
        ru: "Соблюдать норму высева, дробно вносить азот, не загущать посев."
      chemical:
        kk: "Триазолдар немесе морфолиндер (мысалы, фенпропиморф) негізіндегі фунгицидтер — ҚР тізімінен."
        ru: "Фунгициды на основе триазолов или морфолинов (например, фенпропиморф) — из списка РК."
    timing:
      kk: "Шекті деңгейге жеткенде, ту жапырақ шыққанға дейін."
      ru: "При достижении порога, до появления флагового листа."
    prevention:
      kk: "Төзімді сорттар, ауыспалы егіс, өсімдік қалдықтарын терең жыртып көму."
      ru: "Устойчивые сорта, севооборот, глубокая заделка растительных остатков."
    similar:
      kk: "Шаң немесе тыңайтқыш қалдығынан айырмасы — дақтар саусақпен сүртіліп, астында ұлпа сарғаяды."
      ru: "Отличие от пыли или остатков удобрений: налёт стирается, а ткань под ним желтеет."

  fusarium_head_blight:
    severity: high
    name: {kk: "Масақ фузариозы", ru: "Фузариоз колоса"}
    pathogen: "Fusarium graminearum, F. culmorum и др."
    organ: {kk: "масақ", ru: "колос"}
    symptoms:
      kk: "Масақтың бір бөлігі немесе толығымен мерзімінен бұрын бозарады (ағарады), ал сабағы әлі жасыл. Масақшалар негізінде қызғылт-сарғыш споралар. Дән жеңіл, бүрісіп қалады."
      ru: "Часть колоса или весь колос преждевременно белеет (обесцвечивается) при ещё зелёном стебле. У основания колосков — розово-оранжевый налёт спор. Зерно щуплое, лёгкое."
    conditions:
      kk: "Гүлдену кезеңінде жаңбыр мен жылы (20–30 °C) ауа райы. Алдыңғы дақыл — жүгері немесе бидай болса, қауіп жоғары."
      ru: "Дожди и тепло (20–30 °C) в период цветения. Повышенный риск, если предшественник — кукуруза или пшеница."
    threshold:
      kk: "Ауруды масақта көрген соң емдеу тиімсіз — гүлдену кезіндегі ауа райы болжамы бойынша алдын ала өңдеу керек."
      ru: "Лечить после появления симптомов неэффективно — обработку проводят профилактически по прогнозу погоды на цветение."
    actions:
      agro:
        kk: "Зақымданған егістің дәнін бөлек жинап, микотоксинге (ДОН) тексеріңіз; мал азығына абайлап қолданыңыз."
        ru: "Зерно с поражённых участков убирайте отдельно и проверьте на микотоксины (ДОН); осторожно с использованием на корм."
      chemical:
        kk: "Гүлденудің басында триазолдар (тебуконазол, протиоконазол, метконазол) — ҚР тізімінен."
        ru: "В начале цветения — триазолы (тебуконазол, протиоконазол, метконазол) — из списка РК."
    timing:
      kk: "Гүлденудің басы (масақтың ортасында тозаңқаптар шыға бастағанда)."
      ru: "Начало цветения (появление пыльников в средней части колоса)."
    prevention:
      kk: "Ауыспалы егіс (жүгеріден кейін бидай екпеу), қалдықтарды жыртып көму, төзімді сорттар, улағыштан өткен тұқым."
      ru: "Севооборот (не сеять пшеницу после кукурузы), заделка остатков, устойчивые сорта, протравленные семена."
    similar:
      kk: "Кәдімгі пісуден айырмасы: бозарған масақ жасыл масақтардың арасында жеке-жеке кездеседі."
      ru: "Отличие от созревания: обесцвеченные колосья встречаются поодиночке среди зелёных."

  glume_blotch:
    severity: medium
    name: {kk: "Масақ септориозы", ru: "Септориоз колоса (пятнистость колосковых чешуй)"}
    pathogen: "Parastagonospora nodorum"
    organ: {kk: "масақ, жапырақ", ru: "колос, лист"}
    symptoms:
      kk: "Масақ қабыршақтарында қоңыр-сұр, кейін ағарып кететін дақтар мен жолақтар; жапырақта сары жиекті ұзынша қоңыр дақтар. Дақтарда қара нүктелер (пикнидалар)."
      ru: "Буро-серые, затем светлеющие пятна и штрихи на колосковых чешуях; на листьях — удлинённые бурые пятна с жёлтой каймой. В пятнах — тёмные точки пикнид."
    conditions:
      kk: "Жаңбырлы, жылы (20–27 °C) ауа райы; жаңбыр тамшыларымен төменгі жапырақтан жоғарыға тарайды."
      ru: "Дождливая тёплая (20–27 °C) погода; распространяется брызгами дождя с нижних листьев вверх."
    threshold:
      kk: "Шамамен: түтікке шығу — масақтану кезеңінде жоғарғы жапырақтардың 5–10 %-ы зақымданса."
      ru: "Ориентировочно: 5–10 % поражения верхних листьев в фазе выход в трубку — колошение."
    actions:
      agro:
        kk: "Тұқымды улағышпен өңдеу, қалдықтарды көму, ауыспалы егіс."
        ru: "Протравливание семян, заделка остатков, севооборот."
      chemical:
        kk: "Триазол + стробилурин немесе SDHI тобындағы фунгицидтер — ҚР тізімінен."
        ru: "Фунгициды групп триазол + стробилурин или SDHI — из списка РК."
    timing:
      kk: "Ту жапырақ — масақтану кезеңі, жаңбырлы кезеңнің алдында."
      ru: "Флаговый лист — колошение, перед дождливым периодом."
    prevention:
      kk: "Сау тұқым, төзімді сорттар, бидайды бидайдан кейін екпеу."
      ru: "Здоровые семена, устойчивые сорта, не сеять пшеницу по пшенице."
    similar:
      kk: "Фузариоздан айырмасы: қызғылт споралар жоқ, дақтар қоңыр-сұр."
      ru: "Отличие от фузариоза: нет розового налёта, пятна буро-серые."

  healthy_leaf:
    severity: none
    name: {kk: "Сау жапырақ", ru: "Здоровый лист"}
    pathogen: "—"
    organ: {kk: "жапырақ", ru: "лист"}
    symptoms:
      kk: "Ауру белгілері табылмады: жапырақ біркелкі жасыл, дақ, пустула немесе ұнтақ жоқ."
      ru: "Признаков болезни не найдено: лист равномерно зелёный, без пятен, пустул и налёта."
    conditions: {kk: "—", ru: "—"}
    threshold: {kk: "—", ru: "—"}
    actions:
      agro:
        kk: "Өңдеу қажет емес. Егісті аптасына бір рет тексеруді жалғастырыңыз, әсіресе жылы-ылғалды ауа райында."
        ru: "Обработка не нужна. Продолжайте осматривать посев раз в неделю, особенно в тёплую влажную погоду."
      chemical: {kk: "Қажет емес.", ru: "Не требуется."}
    timing: {kk: "—", ru: "—"}
    prevention:
      kk: "Төзімді сорттар, ауыспалы егіс, теңгерімді қоректендіру."
      ru: "Устойчивые сорта, севооборот, сбалансированное питание."
    similar:
      kk: "Бір жапырақ — бүкіл егіс емес: бірнеше жерден суретке түсіріп тексеріңіз."
      ru: "Один лист — ещё не всё поле: проверьте несколько точек."

  healthy_ear:
    severity: none
    name: {kk: "Сау масақ", ru: "Здоровый колос"}
    pathogen: "—"
    organ: {kk: "масақ", ru: "колос"}
    symptoms:
      kk: "Ауру белгілері табылмады: масақ біркелкі түсті, бозарған масақшалар мен дақтар жоқ."
      ru: "Признаков болезни не найдено: колос равномерно окрашен, без обесцвеченных колосков и пятен."
    conditions: {kk: "—", ru: "—"}
    threshold: {kk: "—", ru: "—"}
    actions:
