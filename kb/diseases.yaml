# EginAI — база знаний по болезням пшеницы (kk / ru).
#
# Составлена по открытым справочникам (см. sources). Это ориентировочные
# рекомендации для фермера, а не замена агронома. Конкретные препараты и нормы
# расхода — только из «Списка пестицидов (ядохимикатов), разрешённых к
# применению на территории Республики Казахстан» и по инструкции к препарату.
#
# Поля: name, pathogen, organ, symptoms, conditions, threshold, actions
# (agro / chemical), timing, prevention, similar. Каждое текстовое поле — kk и ru.

sources:
  - id: fao
